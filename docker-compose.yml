# ==============================================================================
# IntelliCore Modular Monolith - Multi-Container Infrastructure
# Version: 2.0.0 | Environment: Local Development
# ==============================================================================

x-calendar-env: &calendar-env
  GOOGLE_CALENDAR_ENABLED: ${GOOGLE_CALENDAR_ENABLED:-false}
  GOOGLE_CALENDAR_EVENT_WRITES_AUTHORIZED: ${GOOGLE_CALENDAR_EVENT_WRITES_AUTHORIZED:-false}
  GOOGLE_CALENDAR_CLIENT_ID: ${GOOGLE_CALENDAR_CLIENT_ID:-}
  GOOGLE_CALENDAR_CLIENT_SECRET: ${GOOGLE_CALENDAR_CLIENT_SECRET:-}
  GOOGLE_CALENDAR_REDIRECT_URI: ${GOOGLE_CALENDAR_REDIRECT_URI:-http://localhost:3000/api/v1/calendar/callback}
  GOOGLE_CALENDAR_ID: ${GOOGLE_CALENDAR_ID:-}
  GOOGLE_CALENDAR_ORGANIZER_UID: ${GOOGLE_CALENDAR_ORGANIZER_UID:-}
  GOOGLE_CALENDAR_TOKEN_KEY: ${GOOGLE_CALENDAR_TOKEN_KEY:-}

services:
  # ----------------------------------------------------------------------------
  # 1. Application Service: Node.js 24 LTS + Express.js 5 + Prisma ORM
  # ----------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: intellicore-app
    container_name: intellicore_app
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      <<: *calendar-env
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Kolkata}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-intellicore_db}
      MYSQL_USER: ${MYSQL_USER:-intellicore_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      DATABASE_URL: mysql://${MYSQL_USER:-intellicore_app}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-intellicore_db}?connection_limit=10&connect_timeout=15
      UPLOAD_DIR: /app/uploads
      EMAIL_MAX_ATTEMPTS: ${EMAIL_MAX_ATTEMPTS:-5}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-100}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-intellicore-dev}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-admin-dev.json
      FOUNDER_EMAIL: ${FOUNDER_EMAIL:-ctrlabhishek@gmail.com}
      FOUNDER_FIREBASE_UID: ${FOUNDER_FIREBASE_UID:-svNt0UTSz9N59EzlaTWR7jsCu5c2}
    volumes:
      # Mount application code for hot reload, excluding node_modules to protect Linux binaries
      - ./package.json:/app/package.json:ro
      - ./backend/src:/app/backend/src:ro
      - ./frontend:/app/frontend:ro
      - ./prisma:/app/prisma
      - ./tests:/app/tests:ro
      - ./vitest.config.js:/app/vitest.config.js:ro
      - ./secrets/firebase-admin-dev.json:/run/secrets/firebase-admin-dev.json:ro
      - uploads_data:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - intellicore_net
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  notification-worker:
    profiles: ["notifications"]
    image: intellicore-app
    restart: unless-stopped
    stop_grace_period: 45s
    command: ["node", "backend/src/scripts/notificationWorker.js"]
    environment:
      <<: *calendar-env
      NODE_ENV: ${NODE_ENV:-development}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      NOTIFICATION_DATABASE_URL: ${NOTIFICATION_DATABASE_URL:-}
      EMAIL_DELIVERY_MODE: ${EMAIL_DELIVERY_MODE:-CAPTURE}
      EMAIL_SMTP_AUTHORIZED: ${EMAIL_SMTP_AUTHORIZED:-false}
      EMAIL_ALLOWED_RECIPIENTS: ${EMAIL_ALLOWED_RECIPIENTS:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-IntelliCore}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
      MEETING_REMINDER_MINUTES: ${MEETING_REMINDER_MINUTES-1440,60,10}
      NOTIFICATION_BATCH_SIZE: ${NOTIFICATION_BATCH_SIZE:-5}
      NOTIFICATION_POLL_MS: ${NOTIFICATION_POLL_MS:-5000}
      EMAIL_RETRY_BASE_SECONDS: ${EMAIL_RETRY_BASE_SECONDS:-60}
      EMAIL_RETRY_CAP_SECONDS: ${EMAIL_RETRY_CAP_SECONDS:-3600}
      NOTIFICATION_TASK_REMINDER_HOURS: ${NOTIFICATION_TASK_REMINDER_HOURS:-24}
      NOTIFICATION_REPORT_REMINDER_MINUTES: ${NOTIFICATION_REPORT_REMINDER_MINUTES:-30}
      NOTIFICATION_COMMENCEMENT_DAYS: ${NOTIFICATION_COMMENCEMENT_DAYS:-2}
      NOTIFICATION_COMPLETION_DAYS: ${NOTIFICATION_COMPLETION_DAYS:-3}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - intellicore_net
  migrate:
    profiles: ["maintenance"]
    image: intellicore-app
    command: ["node", "backend/src/scripts/migrateDatabase.js"]
    environment:
      DATABASE_URL: ${MIGRATION_DATABASE_URL:-}
      SHADOW_DATABASE_URL: ${MIGRATION_SHADOW_DATABASE_URL:-}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-intellicore_db}
    volumes:
      - ./prisma:/app/prisma:ro
      - ./backend/src:/app/backend/src:ro
      - ./package.json:/app/package.json:ro
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - intellicore_net
  # ----------------------------------------------------------------------------
  # 2. Database Service: MySQL 8.4 LTS
  # ----------------------------------------------------------------------------
  mysql:
    image: mysql:8.4
    container_name: intellicore_mysql
    restart: unless-stopped
    # Port 3306 is private to the internal Docker network (not published to host)
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-intellicore_db}
      MYSQL_USER: ${MYSQL_USER:-intellicore_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - intellicore_net
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -u $$MYSQL_USER -p\"$$MYSQL_PASSWORD\" -D $$MYSQL_DATABASE -e 'SELECT 1;' > /dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ----------------------------------------------------------------------------
  # 3. Database Administration: phpMyAdmin
  # ----------------------------------------------------------------------------
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:5.2.2
    container_name: intellicore_phpmyadmin
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_VERBOSE: "IntelliCore MySQL"
      UPLOAD_LIMIT: 64M
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - intellicore_net

# ------------------------------------------------------------------------------
# Persistent Storage Volumes
# ------------------------------------------------------------------------------
volumes:
  mysql_data:
    name: intellicore_mysql_data
  uploads_data:
    name: intellicore_uploads_data

# ------------------------------------------------------------------------------
# Isolated Bridge Network
# ------------------------------------------------------------------------------
networks:
  intellicore_net:
    name: intellicore_network
    driver: bridge

